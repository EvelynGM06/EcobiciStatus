name: muestreo-station-status
on:
  schedule:
    - cron: "*/10 * * * *"   # cada 10 min (UTC). GitHub puede retrasar o saltarse algunas corridas
  workflow_dispatch: {}       # boton "Run workflow" para probar ahora
permissions:
  contents: write
concurrency:
  group: muestreo
  cancel-in-progress: false
jobs:
  foto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python muestreador_status.py
      - name: guardar
        run: |
          git config user.name "muestreador"
          git config user.email "muestreador@users.noreply.github.com"
          git add data
          git commit -m "foto $(date -u +%FT%TZ)" || exit 0
          git pull --rebase -q && git push
